[package]
name = "ntex-files"
version = "4.0.0-beta.0"
authors = ["ntex contributors <team@ntex.rs>"]
description = "Static files support for ntex web."
readme = "README.md"
keywords = ["ntex", "http", "async", "futures"]
homepage = "https://ntex.rs"
repository = "https://github.com/ntex-rs/ntex-extras.git"
documentation = "https://docs.rs/ntex-files/"
categories = ["asynchronous", "web-programming::http-server"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.95"

[lib]
name = "ntex_files"
path = "src/lib.rs"

[dependencies]
ntex = { workspace = true }
ntex-http = { workspace = true }
bitflags = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
httpdate = { workspace = true }
language-tags = { workspace = true }
log = { workspace = true }
mime = { workspace = true }
mime_guess = { workspace = true }
percent-encoding = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
v_htmlescape = { workspace = true }
unicase = { workspace = true }

[dev-dependencies]
ntex = { workspace = true, features = ["neon", "openssl", "compress"] }
