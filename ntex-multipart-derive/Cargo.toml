[package]
name = "ntex-multipart-derive"
version = "4.0.0"
authors = ["ntex contributors <team@ntex.rs>"]
description = "Multipart Derive support for ntex web framework."
readme = "README.md"
keywords = ["http", "web", "framework", "async", "ntex"]
homepage = "https://ntex.rs"
repository = "https://github.com/ntex-rs/ntex-extras.git"
documentation = "https://docs.rs/ntex-multipart-derive/"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.95"

[lib]
name = "ntex_multipart_derive"
path = "src/lib.rs"
proc-macro = true

[dependencies]
bytesize = { workspace = true }
darling = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
ntex = { workspace = true }
ntex-multipart = { workspace = true, features = ["derive"] }
